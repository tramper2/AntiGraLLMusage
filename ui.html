<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Quota Panel</title>
  <script src="/preload.js"></script>
  <script>window.__sidecarReady = true;</script>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-card: #171b26;
      --bg-card-hover: #1e2330;
      --bg-subtle: #12151e;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #38bdf8;
      --accent-indigo: #818cf8;
      --bar-green: #10b981;
      --bar-amber: #f59e0b;
      --bar-red: #ef4444;
      --badge-bg: rgba(56, 189, 248, 0.14);
      --badge-text: #38bdf8;
    }

    @media (prefers-color-scheme: light) {
      :root.auto-theme {
        --bg-primary: #f8fafc;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --bg-subtle: #f1f5f9;
        --border-color: rgba(15, 23, 42, 0.09);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-blue: #0284c7;
        --accent-indigo: #4f46e5;
        --badge-bg: rgba(2, 132, 199, 0.12);
        --badge-text: #0284c7;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 16px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bar-green);
      box-shadow: 0 0 8px var(--bar-green);
      flex-shrink: 0;
    }

    .status-dot.error {
      background: var(--bar-red);
      box-shadow: 0 0 8px var(--bar-red);
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select, button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    select:hover, button:hover {
      background: var(--bg-card-hover);
      border-color: rgba(56, 189, 248, 0.4);
    }

    button.active {
      background: var(--badge-bg);
      color: var(--badge-text);
      border-color: rgba(56, 189, 248, 0.4);
      font-weight: 600;
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
    }

    .user-name {
      color: var(--text-primary);
      font-weight: 600;
    }

    .tier-badge {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(129, 140, 248, 0.18));
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-indigo));
    }

    .hero-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hero-percent {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 2px 0 4px 0;
    }

    .hero-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .view-tabs {
      display: flex;
      gap: 4px;
    }

    .quota-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quota-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .quota-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    .quota-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .model-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .model-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .tag-pill {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 600;
    }

    .tag-pill.notice {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .variants-pills {
      font-size: 11px;
      color: var(--text-muted);
    }

    .quota-numbers {
      text-align: right;
      flex-shrink: 0;
    }

    .rem-pct {
      font-size: 15px;
      font-weight: 800;
    }

    .used-pct {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quota-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 4px;
    }

    .countdown-badge {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: none;
    }

    .footer {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="title-group">
        <span id="statusDot" class="status-dot"></span>
        <h1>Antigravity Quota Panel</h1>
      </div>
      <div class="controls">
        <select id="intervalSelect" title="자동 갱신 주기">
          <option value="10000" selected>10초마다 갱신</option>
          <option value="30000">30초마다 갱신</option>
          <option value="60000">1분마다 갱신</option>
          <option value="0">수동 갱신</option>
        </select>
        <button id="refreshBtn" onclick="loadQuota(true)">↻ 새로고침</button>
      </div>
    </div>

    <div class="user-bar">
      <div class="user-info">
        <span id="userName" class="user-name">연결 중...</span>
        <span id="userEmail"></span>
      </div>
      <span id="tierBadge" class="tier-badge">Google AI Pro</span>
    </div>
  </div>

  <div id="errorBanner" class="error-banner"></div>

  <div id="heroGrid" class="hero-grid"></div>

  <div class="section-header">
    <span class="section-title">모델별 실시간 잔여 쿼터</span>
    <div class="view-tabs">
      <button id="tabFamily" class="active" onclick="setViewMode('family')">그룹별</button>
      <button id="tabAll" onclick="setViewMode('all')">전체 모델</button>
    </div>
  </div>

  <div id="quotaList" class="quota-list"></div>

  <div class="footer">
    <span id="lastUpdated">마지막 조회: -</span>
    <span id="serverMeta">LS: -</span>
  </div>

  <script>
    let latestData = null;
    let viewMode = "family";
    let refreshTimer = null;

    function getBarColor(pct) {
      if (pct <= 20) return "var(--bar-red)";
      if (pct <= 50) return "var(--bar-amber)";
      return "var(--bar-green)";
    }

    function formatKstDate(isoStr) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      });
    }

    function formatCountdown(isoStr) {
      if (!isoStr) return "";
      const target = new Date(isoStr).getTime();
      const now = Date.now();
      const diff = target - now;
      if (diff <= 0) return "곧 리셋 / 대기 중";
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const parts = [];
      if (days > 0) parts.push(`${days}일`);
      if (hours > 0 || days > 0) parts.push(`${hours}시간`);
      parts.push(`${mins}분 ${secs}초`);
      return `리셋까지 ${parts.join(" ")}`;
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById("tabFamily").classList.toggle("active", mode === "family");
      document.getElementById("tabAll").classList.toggle("active", mode === "all");
      render();
    }

    function render() {
      if (!latestData || !latestData.ok) return;

      const u = latestData.user || {};
      document.getElementById("userName").textContent = u.name || "User";
      document.getElementById("userEmail").textContent = u.email ? `(${u.email})` : "";
      document.getElementById("tierBadge").textContent = u.tierName || u.planName || "Pro";

      const families = latestData.families || [];
      const heroTargets = families.slice(0, 2);
      const heroGrid = document.getElementById("heroGrid");
      heroGrid.innerHTML = heroTargets
        .map((f) => {
          const color = getBarColor(f.remainingPercent);
          return `
            <div class="hero-card">
              <div class="hero-label">
                <span>${f.family}</span>
                <span style="color:${color};font-size:11px;">사용 ${f.usedPercent.toFixed(2)}%</span>
              </div>
              <div class="hero-percent" style="color:${color}">${f.remainingPercent.toFixed(2)}%</div>
              <div class="hero-sub" data-reset="${f.resetTime || ""}">${formatCountdown(f.resetTime)}</div>
            </div>
          `;
        })
        .join("");

      const listEl = document.getElementById("quotaList");
      const items = viewMode === "family" ? latestData.families : latestData.models;

      listEl.innerHTML = items
        .map((item) => {
          const name = viewMode === "family" ? item.family : item.label;
          const pct = item.remainingPercent;
          const used = item.usedPercent;
          const color = getBarColor(pct);
          const variantsText =
            viewMode === "family" && item.variants
              ? item.variants
                  .map((v) => {
                    const m = v.label.match(/\(([^)]+)\)$/);
                    return m ? m[1] : v.label;
                  })
                  .join(" · ")
              : item.modelId || "";

          const tagHtml = item.tagTitle
            ? `<span class="tag-pill ${item.tagTitle === "Notice" ? "notice" : ""}">${item.tagTitle}</span>`
            : "";

          return `
            <div class="quota-card">
              <div class="quota-top">
                <div>
                  <div class="model-title-wrap">
                    <span class="model-name">${name}</span>
                    ${tagHtml}
                  </div>
                  <div class="variants-pills">${variantsText}</div>
                </div>
                <div class="quota-numbers">
                  <span class="rem-pct" style="color:${color}">${pct.toFixed(2)}%</span>
                  <span class="used-pct">(사용 ${used.toFixed(2)}%)</span>
                </div>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width:${Math.max(1, pct)}%;background:${color};"></div>
              </div>
              <div class="quota-meta">
                <span>리셋 시각: ${formatKstDate(item.resetTime)}</span>
                <span class="countdown-badge" data-reset="${item.resetTime || ""}">${formatCountdown(item.resetTime)}</span>
              </div>
            </div>
          `;
        })
        .join("");

      const updatedDate = new Date(latestData.timestamp);
      document.getElementById("lastUpdated").textContent =
        "마지막 조회: " +
        updatedDate.toLocaleTimeString("ko-KR", { hour12: false });

      if (latestData.serverInfo) {
        const s = latestData.serverInfo;
        document.getElementById("serverMeta").textContent =
          `${s.processName} (PID ${s.pid} · :${s.port})`;
      }
    }

    async function loadQuota(force = false) {
      const btn = document.getElementById("refreshBtn");
      const dot = document.getElementById("statusDot");
      const errBanner = document.getElementById("errorBanner");
      btn.textContent = "조회 중...";
      try {
        const qs = new URLSearchParams(window.location.search);
        if (force) qs.set("forceRediscover", "1");
        const res = await fetch("/api/quota?" + qs.toString(), { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) {
          throw new Error(data.error || "데이터 조회 실패");
        }
        latestData = data;
        dot.classList.remove("error");
        errBanner.style.display = "none";
        render();
      } catch (err) {
        dot.classList.add("error");
        errBanner.style.display = "block";
        errBanner.textContent = "오류: " + (err.message || String(err));
      } finally {
        btn.textContent = "↻ 새로고침";
      }
    }

    function setupInterval() {
      if (refreshTimer) clearInterval(refreshTimer);
      const ms = parseInt(document.getElementById("intervalSelect").value, 10);
      if (ms > 0) {
        refreshTimer = setInterval(() => loadQuota(false), ms);
      }
    }

    document.getElementById("intervalSelect").addEventListener("change", setupInterval);

    // Tick countdown every 1 second without network call
    setInterval(() => {
      document.querySelectorAll("[data-reset]").forEach((el) => {
        const iso = el.getAttribute("data-reset");
        if (iso) el.textContent = formatCountdown(iso);
      });
    }, 1000);

    loadQuota(false);
    setupInterval();
  </script>
</body>
</html>
